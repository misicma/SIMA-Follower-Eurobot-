<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<title>Pracenje polozaja objekta</title>
<style>
    :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --accent: #38bdf8;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --ok: #22c55e;
        --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px;
    }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
    .status {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        margin-bottom: 16px;
        color: var(--muted);
    }
    .dot {
        width: 9px; height: 9px; border-radius: 50%;
        background: var(--err);
    }
    .dot.live { background: var(--ok); }
    .panel {
        background: var(--panel);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    canvas {
        background: #0b1220;
        border-radius: 8px;
        display: block;
    }
    .stats {
        display: flex;
        gap: 24px;
        margin-top: 16px;
        font-size: 14px;
    }
    .stat-label { color: var(--muted); font-size: 12px; }
    .stat-value { font-size: 18px; font-weight: 600; color: var(--accent); }
</style>
</head>
<body>

<h1>Pracenje polozaja robota - Eurobot polje</h1>
<div class="subtitle">Podaci sa senzora preko MQTT-a (tema: sensor/xy) &middot; polje 3000 x 2000 mm</div>

<div class="status">
    <div class="dot" id="statusDot"></div>
    <span id="statusText">Cekanje na podatke...</span>
</div>

<div class="panel">
    <canvas id="canvas" width="900" height="600"></canvas>
    <div class="stats">
        <div>
            <div class="stat-label">X</div>
            <div class="stat-value" id="valX">--</div>
        </div>
        <div>
            <div class="stat-label">Y</div>
            <div class="stat-value" id="valY">--</div>
        </div>
        <div>
            <div class="stat-label">Poslednje azuriranje</div>
            <div class="stat-value" id="valTime" style="font-size:14px;">--</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// Dimenzije stvarnog Eurobot polja, u milimetrima (uskladjeno sa RpiApp.py)
const FIELD_W = 3000;
const FIELD_H = 2000;
const RANGE_MIN = 0;
const RANGE_MAX = FIELD_W; // koristi se samo za X; Y se skalira posebno

// Precnik robota na terenu (orijentaciono, za crtanje - Eurobot roboti su do ~300mm)
const ROBOT_DIAMETER_MM = 250;

let history = [];
let lastData = null;

function toCanvasCoords(x, y) {
    const px = (x / FIELD_W) * canvas.width;
    // Y osa je obrnuta na canvasu
    const py = canvas.height - (y / FIELD_H) * canvas.height;
    return [px, py];
}

function mmToPx(mm) {
    return (mm / FIELD_W) * canvas.width;
}

const fieldImage = new Image();
let fieldImageLoaded = false;
fieldImage.onload = () => {
    fieldImageLoaded = true;
    draw(lastData);
};

function drawField() {
    if (fieldImageLoaded) {
        ctx.drawImage(fieldImage, 0, 0, canvas.width, canvas.height);
    } else {
        // Rezervna pozadina dok se slika terena ucitava
        ctx.fillStyle = "#16213a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
}

function draw(latest) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawField();

    // Putanja
    if (history.length > 1) {
        ctx.strokeStyle = "rgba(56, 189, 248, 0.4)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        history.forEach((p, i) => {
            const [px, py] = toCanvasCoords(p.x, p.y);
            if (i === 0) ctx.moveTo(px, py);
            else ctx.lineTo(px, py);
        });
        ctx.stroke();
    }

    // Trenutna pozicija robota (krug priblizne stvarne velicine)
    if (latest) {
        const [px, py] = toCanvasCoords(latest.x, latest.y);
        const r = mmToPx(ROBOT_DIAMETER_MM) / 2;

        ctx.fillStyle = "#38bdf8";
        ctx.beginPath();
        ctx.arc(px, py, r, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "rgba(56, 189, 248, 0.6)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(px, py, r + 6, 0, Math.PI * 2);
        ctx.stroke();
    }
}

async function fetchLatest() {
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    try {
        const res = await fetch("/api/latest");
        if (!res.ok) {
            statusDot.classList.remove("live");
            statusText.textContent = "Jos uvek nema podataka sa senzora";
            return;
        }
        const data = await res.json();

        document.getElementById("valX").textContent = data.x;
        document.getElementById("valY").textContent = data.y;
        document.getElementById("valTime").textContent =
            new Date(data.received_at).toLocaleTimeString();

        statusDot.classList.add("live");
        statusText.textContent = "Prijem podataka uzivo";

        history.push(data);
        if (history.length > 50) history.shift();

        lastData = data;
        draw(data);
    } catch (err) {
        statusDot.classList.remove("live");
        statusText.textContent = "Greska pri povezivanju sa serverom";
    }
}

drawField();
fetchLatest();
setInterval(fetchLatest, 2000);
</script>
